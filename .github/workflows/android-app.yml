name: 안드로이드 앱 빌드 (오늘얼마(가계부))

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android-app.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 패키지 설치와 동기화
        run: |
          npm ci
          npx cap sync android
      - name: 서명 키 준비
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "file=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          fi
      - name: APK 빌드
        working-directory: app/android
        env:
          KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/오늘얼마-가계부-${VERSION_NAME}.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/오늘얼마-가계부-${VERSION_NAME}-테스트용.apk"
          fi
      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: 오늘얼마-가계부-${{ env.VERSION_NAME }}
          path: ${{ github.workspace }}/*.apk
      - name: 릴리스에 APK 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.VERSION_NAME }}
          name: 오늘얼마(가계부) ${{ env.VERSION_NAME }}
          files: ${{ github.workspace }}/*.apk
          body: 안드로이드 앱 자동 빌드. APK 파일을 폰에서 내려받아 설치하세요.
