<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>오늘얼마</title>
<meta name="theme-color" content="#FFF4D6">
<script>(function(){var t="bang";try{t=localStorage.getItem("receipt-app.theme")||"bang"}catch(e){}document.documentElement.setAttribute("data-theme",t)})()</script>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon-48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Jua&family=Do+Hyeon&family=Gaegu:wght@700&family=Dongle:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#E9EDF4; --line:#DDE3EC;
  --ink:#121826; --sub:#556072; --accent:#2B59E8; --accent-ink:#FFFFFF; --accent-soft:#E6EDFF;
  --warn:#9A4A00; --warn-soft:#FFF0DC; --ok:#1E6B47; --ok-soft:#E1F3EA;
  --sans:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  --tf:var(--sans); --tw:700; --nf:var(--mono); --r:14px; --r2:12px;
}
@media (prefers-color-scheme:dark){:root[data-theme="base"]{
  --bg:#0E121A; --surface:#171C27; --sunk:#202736; --line:#2A3242;
  --ink:#EEF1F7; --sub:#A3ADBE; --accent:#7B9BFF; --accent-ink:#0E121A; --accent-soft:#1F2A4A;
  --warn:#FFB867; --warn-soft:#3A2A14; --ok:#7FD3A8; --ok-soft:#173326}}
:root[data-theme="dark"]{
  --bg:#0E121A; --surface:#171C27; --sunk:#202736; --line:#2A3242;
  --ink:#EEF1F7; --sub:#A3ADBE; --accent:#7B9BFF; --accent-ink:#0E121A; --accent-soft:#1F2A4A;
  --warn:#FFB867; --warn-soft:#3A2A14; --ok:#7FD3A8; --ok-soft:#173326}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);-webkit-text-size-adjust:100%;font-size:15px;line-height:1.5}
#app{max-width:460px;margin:0 auto;min-height:100vh;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sub{color:var(--sub)}
.top{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;letter-spacing:-.3px}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-style:normal}
.title{font-size:17px;font-weight:700}
.pill{font-size:13px;font-weight:600;border-radius:999px;padding:6px 12px;background:var(--surface);border:1px solid var(--line);color:var(--sub)}
button.pill{min-height:44px;padding:6px 14px;display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.modal .box{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px 20px 18px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:16px;text-align:center}
.modal .box h2{margin:0;font-size:17px;font-weight:700}
.chip{font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.iconbtn.sm{width:38px;height:38px}
.slip{position:relative;background:var(--surface);padding:20px 20px 26px;border-radius:14px 14px 0 0;margin-bottom:10px}
.slip::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;background:linear-gradient(-45deg,transparent 6px,var(--surface) 0) 0 0/12px 10px repeat-x,linear-gradient(45deg,transparent 6px,var(--surface) 0) 0 0/12px 10px repeat-x}
.slip .lbl{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--sub)}
.slip .big{font-size:34px;font-weight:600;margin-top:2px;line-height:1.15}
.slip .meta{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);margin-top:14px;padding-top:12px;font-size:13px;color:var(--sub)}
.bars{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:14px}
.bars span{flex:1;min-width:2px;background:var(--sunk);border-radius:2px 2px 0 0}
.bars span.on{background:var(--accent)}
.bars span.today{background:var(--ink)}
.btn{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;font-weight:600;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--sub);min-height:44px;font-size:14px}
.btn.sm{min-height:46px;font-size:14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:8px 2px 0}
.sec h2{margin:0;font-size:15px;font-weight:700}
.link{border:0;background:none;color:var(--accent);font-size:14px;font-weight:600;padding:10px 0;min-height:44px}
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:14px 16px;min-height:60px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item:hover{background:var(--sunk)}
.item .nm{font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.item .dt{font-size:12px;color:var(--sub);margin-top:1px}
.item .amt{font-size:15px;font-weight:600;white-space:nowrap}
.item.dup{box-shadow:inset 3px 0 0 var(--warn)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 6px;font-size:13px;font-weight:700;color:var(--sub)}
.dayhead .num{color:var(--ink)}
.zero{display:flex;justify-content:space-between;padding:6px 4px;font-size:13px;color:var(--sub)}
.empty{background:var(--surface);border-radius:14px;padding:22px 18px;font-size:14px;color:var(--sub);text-align:center}
.done{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px;text-align:center}
.done .ring{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.done h1{margin:10px 0 0;font-size:22px;font-weight:700;letter-spacing:-.4px}
.form{background:var(--surface);border-radius:14px;padding:4px 18px}
.field{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field label{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.02em}
.field input{font:600 17px var(--sans);border:0;background:transparent;color:var(--ink);padding:4px 0;width:100%;outline:none;border-radius:0}
.field input[type=number],.field input[type=date]{font-family:var(--mono)}
.field input:focus{box-shadow:0 2px 0 var(--accent)}
.fname{font-size:12px;color:var(--sub);text-align:center;word-break:break-all}
.err{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:500}
.spin{width:64px;height:64px;border-radius:50%;border:5px solid var(--sunk);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.busy{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:70vh;text-align:center}
.busy h1{margin:0;font-size:20px}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav .title{min-width:104px;text-align:center}
.copybox{background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
textarea{width:100%;height:140px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:13px/1.4 var(--mono)}
.failcard{background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:inset 3px 0 0 var(--warn)}
.storebtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;max-width:100%;padding:6px 12px 6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;font-weight:700;letter-spacing:-.2px}
.storebtn .sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.item .nm .dot{margin-right:-2px}
.by{color:var(--accent);font-weight:600}
.footrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 2px;font-size:13px}
.link.muted{color:var(--sub)}
.danger,.btn.quiet.danger,.link.danger{color:#C62828}
@media (prefers-color-scheme:dark){.danger,.btn.quiet.danger,.link.danger{color:#FF8A80}}
.field select{font:600 17px var(--sans);border:0;background:transparent;color:var(--ink);padding:4px 0;width:100%;outline:none}
.field select:disabled,.field input:disabled{opacity:.7}
.cks{display:flex;flex-wrap:wrap;gap:8px}
.ck{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.ck input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.mcard{background:var(--surface);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mcard .link{padding:6px 0;min-height:36px;text-align:left}
.slist{display:flex;flex-direction:column;gap:6px;text-align:left}
.srow{display:flex;align-items:center;gap:8px}
.sopt{flex:1;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;font-weight:600;text-align:left}
.sopt.on{border-color:var(--accent);background:var(--accent-soft)}
.sopt .tick{margin-left:auto;color:var(--accent)}
.srow .link{padding:0 6px}
.dlginput{font:600 17px var(--sans);width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.modal .box .sub{font-size:14px;line-height:1.5}
.modal .box{max-height:85vh;overflow:auto}
#undobar{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:8px 8px 8px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:40;max-width:92vw}
#undobar button{border:0;background:var(--accent);color:#fff;font-weight:700;border-radius:999px;padding:0 16px;min-height:40px}
.tools{display:flex;gap:6px}
.tool{min-height:40px;min-width:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:700}
.hmonth{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:-4px}
.hmlabel{border:0;background:none;color:var(--ink);font:700 18px var(--sans);min-height:44px;padding:0 6px;letter-spacing:-.3px}
.cbar{display:flex;height:12px;border-radius:999px;overflow:hidden;margin-top:14px;background:var(--sunk);gap:2px}
.cbar span{min-width:3px}
.clist{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.crow{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;min-height:30px;font-size:14px}
.crow .cn{font-weight:600}
.crow .cp{color:var(--sub);font-size:13px;min-width:38px;text-align:right}
.crow .ca{font-weight:600;min-width:84px;text-align:right}
.crow.more{display:block;text-align:right}
.crow.more .link{min-height:32px;padding:0;font-size:13px}
.cattag{font-weight:600}
.note{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.amtcard .field{padding:14px 0}
.amtrow{display:flex;align-items:baseline;gap:6px}
.amtrow input{font:600 30px var(--mono)!important;text-align:right;letter-spacing:-.02em}
.amtrow span{font-size:20px;font-weight:700}
.catcard{padding-bottom:12px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.cat{display:flex;align-items:center;justify-content:center;gap:5px;min-height:44px;padding:0 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;font-weight:600;white-space:nowrap}
.cat.on{background:var(--c);border-color:var(--c);color:#fff}
.cat.on .dot{background:#fff!important}
.cat:disabled{opacity:.6}
.cats.mini{grid-template-columns:repeat(3,1fr);margin-top:10px}
.cats.mini .cat{min-height:32px;font-size:11px}
.thumb{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:var(--sunk)}
.stick{position:sticky;bottom:0;display:flex;flex-direction:column;gap:6px;padding:10px 0 calc(6px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.cmp{display:flex;flex-direction:column;gap:10px;margin-top:12px;font-size:12px}
.cmp .cbar{margin-top:4px}
.up{color:#C62828}.down{color:var(--ok)}
@media (prefers-color-scheme:dark){.up{color:#FF8A80}}
.stable{padding:6px 14px}
.srow3{display:grid;grid-template-columns:auto 1fr 84px 76px 70px;gap:6px;align-items:center;min-height:40px;font-size:13px;border-top:1px solid var(--line)}
.srow3:first-child{border-top:0}
.srow3.head{color:var(--sub);font-size:12px;font-weight:600;min-height:32px}
.srow3 .cn{font-weight:600}
.srow3>span:nth-child(n+3){text-align:right}
.hhead{display:flex;align-items:center;gap:8px;text-align:left}
.hhead h2{flex:1;margin:0;font-size:17px}
.hstep{font-size:12px;color:var(--sub);background:var(--sunk);border-radius:999px;padding:3px 9px}
.hmock{background:var(--sunk);border-radius:14px;padding:16px;display:flex;justify-content:center}
.hm-card{background:var(--surface);border-radius:12px;padding:14px;width:100%;max-width:260px;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.hm-lbl{font-size:11px;color:var(--sub);font-weight:600}
.hm-amt{font-size:24px;font-weight:600;text-align:right}
.hm-row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-top:1px solid var(--line)}
.hm-row span{color:var(--sub)}
.hm-btn{margin-top:10px;background:var(--accent);color:var(--accent-ink);border-radius:8px;text-align:center;font-size:13px;font-weight:700;padding:8px}
.htext{font-size:15px;line-height:1.6;text-align:left}
.hdots{display:flex;justify-content:center;gap:6px}
.hdots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.hdots span.on{background:var(--accent);width:18px;border-radius:4px}
.catlist .catrow{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-top:1px solid var(--line);min-height:60px}
.catlist .catrow:first-child{border-top:0}
.cdot{width:14px;height:14px;border-radius:50%;flex:none}
.catrow .iconbtn.sm{width:36px;height:36px;font-weight:700}
.catrow .iconbtn:disabled{opacity:.3}
.catrow .link{padding:0 4px}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sw{aspect-ratio:1;border-radius:50%;border:3px solid transparent;min-width:28px}
.sw.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
/* ===== themes ===== */
.num{font-family:var(--nf)}
.title,.sec h2,.hmlabel,.done h1,.modal h2,.monthnav .title{font-family:var(--tf);font-weight:var(--tw)}
.list,.form,.empty,.copybox,.mcard,.failcard,.note,.err{border-radius:var(--r)}
.btn,.storebtn,.iconbtn,.cat,.sopt,.dlginput{border-radius:var(--r2)}
.logo{display:flex;align-items:center;gap:8px}
.logo img{width:30px;height:30px;border-radius:9px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.logo span{font-family:'Jua',var(--sans);font-size:24px;line-height:1;color:var(--ink)}
.logo b{font-weight:400;color:#F76707}
.loginlogo{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 0 10px;text-align:center}
.loginlogo img{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 24px rgba(0,0,0,.15)}
.loginlogo .nm{font-family:'Jua',var(--sans);font-size:44px;line-height:1;color:var(--ink)}
.loginlogo .nm b{font-weight:400;color:#F76707}
.loginlogo .tg{font-family:'Jua',var(--sans);font-size:17px;color:var(--sub)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{border:2px solid var(--line);border-radius:14px;padding:8px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:44px}
.tcard.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tprev{border-radius:10px;height:86px;padding:8px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.tprev .pc{border-radius:7px;padding:6px 8px;font-size:15px;line-height:1.1}
.tprev .pb{height:8px;border-radius:999px}
.tname{font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
/* 방긋 */
:root[data-theme="bang"]{--bg:#FFF4D6;--surface:#FFFDF6;--sunk:#FCEBCB;--line:#F3DFC0;--ink:#3B2F2F;--sub:#8A6A4F;--accent:#F76707;--accent-ink:#fff;--accent-soft:#FFE8CC;
  --warn:#B35400;--warn-soft:#FFE3C2;--ok:#2B8A3E;--ok-soft:#E3F6E7;--tf:'Jua';--tw:400;--nf:'Jua';--r:22px;--r2:999px;color-scheme:light}
[data-theme="bang"] .slip{border-radius:var(--r);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);margin-bottom:4px}
[data-theme="bang"] .slip::after{display:none}
[data-theme="bang"] .slip .big{color:var(--accent)}
[data-theme="bang"] .list,[data-theme="bang"] .form,[data-theme="bang"] .empty,[data-theme="bang"] .mcard{border:2px solid var(--line)}
[data-theme="bang"] .btn{font-family:'Jua';font-weight:400;font-size:16px;border-width:2px}
[data-theme="bang"] .btn.primary{box-shadow:0 5px 0 #C24E00}
[data-theme="bang"] .item .nm,[data-theme="bang"] .storebtn,[data-theme="bang"] .tool{font-family:'Jua';font-weight:400}
[data-theme="bang"] .storebtn,[data-theme="bang"] .tool,[data-theme="bang"] .iconbtn{border-width:2px}
/* 다이어리 */
:root[data-theme="diary"]{--bg:#F7F1E3;--surface:#FFFDF7;--sunk:#EFE6D3;--line:#E5D9C3;--ink:#3E3A35;--sub:#8A7F70;--accent:#D9480F;--accent-ink:#fff;--accent-soft:#FDEBD8;
  --warn:#A6461A;--warn-soft:#FCE3D2;--ok:#2F7D4F;--ok-soft:#E4F3E8;--tf:'Gaegu';--tw:700;--r:6px;--r2:8px;color-scheme:light}
[data-theme="diary"] body,[data-theme="diary"]{background:repeating-linear-gradient(#F7F1E3 0 27px,#EADFC9 27px 28px)}
[data-theme="diary"] .slip{border-radius:6px;transform:rotate(-.5deg);border:1.5px solid var(--line);box-shadow:2px 3px 0 rgba(120,100,70,.12);margin:8px 0 4px}
[data-theme="diary"] .slip::after{content:"";left:50%;right:auto;top:-10px;bottom:auto;width:88px;height:18px;margin-left:-44px;background:rgba(255,169,77,.55);transform:rotate(-3deg)}

    var ids={};remote.forEach(function(e){ids[e.id]=1});
    /* entries made on this phone that never reached the server are kept and pushed up */
    var localOnly=S.entries.filter(function(e){return !ids[e.id]&&!e.synced&&!e.deleted});
    localOnly.forEach(function(e){if(!e.store||!storeById(e.store))e.store=targetStore();e.uid=S.uid;saveDb(e)});
    S.entries=remote.concat(localOnly).sort(function(a,b){return (a.at||0)-(b.at||0)});
    persist();
  }catch(err){toast('서버에서 불러오지 못해 이 기기 기록을 보여요')}
}
async function loadCats(){var r=await sb.from('categories').select('*').order('sort').order('created_at');if(!r.error&&r.data&&r.data.length)S.cats=r.data}
async function loadStores(){var r=await sb.from('stores').select('*').order('created_at');S.stores=r.data||[]}
async function loadMembers(){

async function boot(session){
  S.uid=session.user.id;S.myEmail=String(session.user.email||'').toLowerCase();
  S.view='loading';render();
  var r=await sb.from('members').select('*').eq('email',S.myEmail).maybeSingle();
  if(r.error||!r.data){S.view='noaccess';render();return}
  S.me=r.data;
  await loadStores();
  await loadCats();
  await loadMembers();
  var saved=null;try{saved=localStorage.getItem(SKEY)}catch(e){}
  if(saved==='all'&&S.stores.length>1)setStore('all');
  else if(saved&&storeById(saved))setStore(saved);

  await loadReceipts();
  initNav();S.view='home';
  try{if(!localStorage.getItem('receipt-app.help.v1'))S.dlg={type:'help',i:0}}catch(e){}

async function saveCat(){

  d.busy=true;render();

    var r=await sb.from('categories').update({name:name,color:d.color,icon:d.icon||null}).eq('id',old.id);

      var r2=await sb.from('receipts').update({category:name}).eq('category',d.name);
      if(r2.error)toast('기존 기록의 분류 이름을 바꾸지 못했어요');

/* ---------- delete with undo ---------- */
function softDelete(ids,msg){
  var now=new Date().toISOString();
  ids.forEach(function(id){var e=byId(id);if(!e)return;clearTimeout(qTimers[id]);e.deleted=true;e.deletedAt=now});
  persist();
  sb.from('receipts').update({deleted_at:now}).in('id',ids).then(function(r){if(r.error)toast('서버에서 지우지 못했어요')});
  clearTimeout(softDelete._t);S.undo={ids:ids,msg:msg};
  softDelete._t=setTimeout(function(){S.undo=null;render()},7000);
}
function undoDelete(){
  var u=S.undo;if(!u)return;clearTimeout(softDelete._t);S.undo=null;
  u.ids.forEach(function(id){var e=byId(id);if(e){e.deleted=false;e.deletedAt=null}});persist();
  sb.from('receipts').update({deleted_at:null}).in('id',u.ids).then(function(r){if(r.error)toast('되돌리지 못했어요. 인터넷을 확인해 주세요');else toast('되돌렸어요')});
  render();
}

async function saveStore(){
  var d=S.dlg;var name=(($('#d-sname')||{}).value||'').trim();
  if(!name){d.msg='매장 이름을 입력해 주세요';render();return}
  if(S.stores.some(function(s){return s.name===name&&s.id!==d.id})){d.msg='같은 이름의 매장이 있어요';render();return}
  if(d.id){
    var r=await sb.from('stores').update({name:name}).eq('id',d.id);
    if(r.error){d.msg='저장하지 못했어요';render();return}
    storeById(d.id).name=name;S.dlg={type:'stores'};render();toast('매장 이름을 바꿨어요');
  }else{
    var used=S.stores.map(function(s){return s.color});
    var color=PALETTE.filter(function(c){return used.indexOf(c)<0})[0]||PALETTE[S.stores.length%PALETTE.length];
    var r2=await sb.from('stores').insert({name:name,color:color}).select().single();
    if(r2.error){d.msg='추가하지 못했어요';render();return}
    S.stores.push(r2.data);setStore(r2.data.id);S.dlg=null;render();toast(name+' 매장을 추가했어요');
  }
}
async function deleteStore(id){
  if(live().some(function(e){return e.store===id})){toast('영수증이 남아 있는 매장은 삭제할 수 없어요');S.dlg={type:'stores'};render();return}
  await sb.from('receipts').delete().eq('store_id',id);
  var r=await sb.from('stores').delete().eq('id',id);
  if(r.error){toast('삭제하지 못했어요');S.dlg={type:'stores'};render();return}
  S.stores=S.stores.filter(function(s){return s.id!==id});
  S.entries=S.entries.filter(function(e){return e.store!==id});persist();
  if(S.store===id)setStore(S.stores[0]?S.stores[0].id:null);
  if(S.store==='all'&&S.stores.length<2&&S.stores[0])setStore(S.stores[0].id);

}

/* ---------- AI reading (server route /api/read) ---------- */
function shrink(file){return new Promise(function(res){
  var url=URL.createObjectURL(file);var img=new Image();
  img.onload=function(){try{var max=1600,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
    var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(function(b){URL.revokeObjectURL(url);res(b||file)},'image/jpeg',0.85)}catch(e){URL.revokeObjectURL(url);res(file)}};
  img.onerror=function(){URL.revokeObjectURL(url);res(file)};img.src=url})}
function toB64(blob){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(',')[1])};fr.onerror=rej;fr.readAsDataURL(blob)})}
async function analyze(small){
  var s=await sb.auth.getSession();var tok=s.data&&s.data.session&&s.data.session.access_token;
  if(!tok)throw{code:'not_granted'};
  var image=await toB64(small);
  var r;try{r=await fetch('/api/read',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify({image:image,categories:catNames()})})}
  catch(e){throw{code:'unavailable'}}
  if(r.status===401)throw{code:'not_granted'};
  if(r.status===429)throw{code:'rate_limited'};
  if(!r.ok){var ej={};try{ej=await r.json()}catch(x){}
    throw{code:'server',status:r.status,err:ej.error||'',up:ej.status||0,detail:ej.message||''}}
  var o=await r.json();
  if(o.error==='not_receipt')throw{code:'not_receipt'};
  if(o.error)throw{code:'server',status:r.status,err:o.error,detail:o.message||''};
  return o}
function errMsg(e){var c=e&&e.code;
  if(c==='not_granted')return '로그인이 만료됐어요. 다시 로그인해 주세요.';
  if(c==='rate_limited')return '요청이 몰렸어요. 잠시 후 다시 시도해 주세요.';
  if(c==='unavailable')return '읽기 서버에 연결하지 못했어요. 인터넷을 확인해 주세요.';
  if(c==='server'){
    if(e.err==='server_not_configured')return '[설정] Vercel에 ANTHROPIC_API_KEY가 없어요. 키를 넣고 Redeploy 해 주세요.';
    if(e.err==='upstream'){var d=String(e.detail||'');
      if(/credit|balance|billing/i.test(d))return '[크레딧] Claude API 크레딧이 부족해요. 충전해 주세요. ('+d+')';
      if(e.up===401)return '[키 오류] API 키가 잘못됐어요. 키를 다시 복사해 넣어 주세요.';

/* ---------- save / export (plain browser downloads) ---------- */
var NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
var saverP=null;
function nativeCall(m,o){var C=window.Capacitor;
  if(C.registerPlugin){saverP=saverP||C.registerPlugin('Saver');return saverP[m](o)}
  return C.nativePromise('Saver',m,o)}
function saveWhere(blob){return NATIVE?((blob.type||'').indexOf('image/')===0?'사진/오늘얼마 폴더':'다운로드/오늘얼마 폴더'):'다운로드 폴더'}
function downloadBlob(blob,name){
  if(NATIVE){
    var img=(blob.type||'').indexOf('image/')===0;var mm=/^(\d{4})(\d{2})\d{2}_/.exec(name);
    var rd=new FileReader();rd.onload=function(){
      nativeCall('save',{data:String(rd.result),name:name,mime:blob.type||'application/octet-stream',sub:img&&mm?mm[1]+'년 '+mm[2]+'월':''})
        .catch(function(err){toast('저장하지 못했어요: '+((err&&err.message)||''))})};
    rd.readAsDataURL(blob);return}
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}

  else if(a==='savedraft')saveDraft();
  else if(a==='skipdraft')nextDraft();
  else if(a==='pickcat'){var te=editTarget();if(!te)return;te.category=b.getAttribute('data-cat');
    $$('.cats .cat').forEach(function(x){var on=x.getAttribute('data-cat')===te.category;x.classList.toggle('on',on);x.setAttribute('aria-checked',on)});afterEdit(te)}
  else if(a==='stats')go('stats');
  else if(a==='backup')go('backup');
  else if(a==='help')openDlg({type:'help',i:0});
  else if(a==='theme')openDlg({type:'theme'});
  else if(a==='settheme'){setTheme(b.getAttribute('data-t'));render()}
  else if(a==='helpnext'){S.dlg.i++;render()}
  else if(a==='helpprev'){S.dlg.i--;render()}
  else if(a==='exportcsv')exportCsv();
  else if(a==='exportjson')exportJson();
  else if(a==='importjson')$('#f-json').click();
  else if(a==='import-yes')doImport();
  else if(a==='prev'||a==='next'){var p=S.month.split('-').map(Number);var d=new Date(p[0],p[1]-1+(a==='next'?1:-1),1);S.month=d.getFullYear()+'-'+pad(d.getMonth()+1);S.copyText='';history.replaceState(snap(),'');render()}
});
function editTarget(){if(S.view==='confirm')return curDraft();var e=curE();return e&&canEdit(e)?e:null}
function afterEdit(e){if(S.view!=='confirm')queueSave(e);var fn=$('#fname');if(fn)fn.textContent=fname(e);var db=$('#dupbox');if(db)db.innerHTML=dupHtml(e)}
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(S.view==='search'&&t.id&&t.id.indexOf('s-')===0){var q=S.q;var k=t.id.slice(2);if(k in q){q[k]=t.value}
    if(k==='period'){var c=$('#s-custom');if(c)c.hidden=t.value!=='custom'}refreshSearch();return}
  var e=editTarget();if(!e)return;
  if(t.id==='f-date'&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){e.date=t.value;e.check=false}
  else if(t.id==='f-item')e.item=t.value.slice(0,20);
  else if(t.id==='f-place')e.place=t.value.slice(0,40);
  else if(t.id==='f-amt')e.amount=Math.max(0,Math.round(Number(t.value))||0);
  else if(t.id==='f-store'){e.store=t.value}
  else if(t.id==='f-card')e.card=t.value.slice(0,20)
  else return;
  afterEdit(e)});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Enter')return;
  if(ev.target.id==='em'||ev.target.id==='pw')pwLogin();
  else if(ev.target.id==='d-pw1'||ev.target.id==='d-pw2')setPassword();
  else if(ev.target.id==='d-sname')saveStore();
  else if(ev.target.id==='d-mname')renameMember();
  else if(ev.target.id==='d-cname')saveCat();
});
$('#f-json').addEventListener('change',function(ev){var f=ev.target.files&&ev.target.files[0];ev.target.value='';if(f)readImport(f)});
['#f-cam','#f-alb'].forEach(function(id){$(id).addEventListener('change',function(ev){var list=Array.prototype.slice.call(ev.target.files||[]);ev.target.value='';handleFiles(list)})});

if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){})}
setTheme(curTheme());
S.view='loading';render();
setTimeout(function(){if(!S.started&&S.view==='loading'){S.view='login';render()}},4000);
})();
</script>
</body></html>
