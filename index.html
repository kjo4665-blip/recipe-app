<style>

  --ink:#121826; --sub:#556072; --accent:#2B59E8; --accent-ink:#FFFFFF; --accent-soft:#E6EDFF;

  --ink:#EEF1F7; --sub:#A3ADBE; --accent:#7B9BFF; --accent-ink:#0E121A; --accent-soft:#1F2A4A;
  --warn:#FFB867; --warn-soft:#3A2A14; --ok:#7FD3A8; --ok-soft:#173326}}
:root[data-theme="dark"]{

*{box-sizing:border-box}
html,body{background:var(--bg);margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);-webkit-text-size-adjust:100%;font-size:15px;line-height:1.5}

.modal .box{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px 20px 18px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:16px;text-align:center}

.item.dup{box-shadow:inset 3px 0 0 var(--warn)}

.zero{display:flex;justify-content:space-between;padding:6px 4px;font-size:13px;color:var(--sub)}
.empty{background:var(--surface);border-radius:14px;padding:22px 18px;font-size:14px;color:var(--sub);text-align:center}

.form{background:var(--surface);border-radius:14px;padding:4px 18px}
.field{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field label{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.02em}
.field input{font:600 17px var(--sans);border:0;background:transparent;color:var(--ink);padding:4px 0;width:100%;outline:none;border-radius:0}
.field input[type=number],.field input[type=date]{font-family:var(--mono)}
.field input:focus{box-shadow:0 2px 0 var(--accent)}
.fname{font-size:12px;color:var(--sub);text-align:center;word-break:break-all}
.err{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:500}
.spin{width:64px;height:64px;border-radius:50%;border:5px solid var(--sunk);border-top-color:var(--accent);animation:sp 1s linear infinite}

@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.busy{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:70vh;text-align:center}

.monthnav{display:flex;align-items:center;gap:6px}
.monthnav .title{min-width:104px;text-align:center}
.copybox{background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
textarea{width:100%;height:140px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:13px/1.4 var(--mono)}
.failcard{background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:inset 3px 0 0 var(--warn)}
.storebtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;max-width:62vw;padding:6px 12px 6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;font-weight:700;letter-spacing:-.2px}
.storebtn .sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.item .nm .dot{margin-right:-2px}
.by{color:var(--accent);font-weight:600}
.footrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 2px;font-size:13px}
.link.muted{color:var(--sub)}
.danger,.btn.quiet.danger,.link.danger{color:#C62828}
@media (prefers-color-scheme:dark){.danger,.btn.quiet.danger,.link.danger{color:#FF8A80}}
.field select{font:600 17px var(--sans);border:0;background:transparent;color:var(--ink);padding:4px 0;width:100%;outline:none}
.field select:disabled,.field input:disabled{opacity:.7}
.cks{display:flex;flex-wrap:wrap;gap:8px}
.ck{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.ck input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.mcard{background:var(--surface);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mcard .link{padding:6px 0;min-height:36px;text-align:left}
.slist{display:flex;flex-direction:column;gap:6px;text-align:left}
.srow{display:flex;align-items:center;gap:8px}
.sopt{flex:1;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;font-weight:600;text-align:left}
.sopt.on{border-color:var(--accent);background:var(--accent-soft)}
.sopt .tick{margin-left:auto;color:var(--accent)}
.srow .link{padding:0 6px}
.dlginput{font:600 17px var(--sans);width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.modal .box .sub{font-size:14px;line-height:1.5}
.modal .box{max-height:85vh;overflow:auto}
#undobar{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:8px 8px 8px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:40;max-width:92vw}
#undobar button{border:0;background:var(--accent);color:#fff;font-weight:700;border-radius:999px;padding:0 16px;min-height:40px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style>

<script>
(function(){
var SB_URL='https://ahgnlnyfyyoietjyjnhc.supabase.co';
var SB_KEY='sb_publishable__jO-LKY2dxdi2QXonfzaIQ_dIQd8G9c';
var sb=window.supabase.createClient(SB_URL,SB_KEY);

var KEY='receipt-app.v2';
var SKEY='receipt-app.store';
var PALETTE=['#2B59E8','#1E9E6A','#D9480F','#8E44AD','#C2185B','#00838F','#B7791F','#455A64'];
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})};
var won=function(n){return '₩'+Number(n||0).toLocaleString('ko-KR')};
var pad=function(n){return String(n).padStart(2,'0')};
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(e){return[]}}
function newId(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
var files=new Map();
var S={view:'home',cur:null,month:todayStr().slice(0,7),err:'',entries:load(),copyText:'',batch:null,prog:null,
  started:false,email:'',sending:false,sent:false,loginMsg:'',
  uid:null,myEmail:'',me:null,stores:[],store:null,lastStore:null,members:[],mstores:[],dlg:null,undo:null,busyMsg:''};
var qTimers={};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S.entries))}catch(e){}}
function toast(m){var t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast._t);toast._t=setTimeout(function(){t.className=''},2400)}

var LOGO='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9.5 9h5M9.5 13h3"/></svg>';
var CHECK='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var CAM='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
var IMG='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 16l5-5 4 4 3-3 4 4"/></svg>';
var BACK='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
var NEXT='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
var CARET='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

/* ---------- roles & stores ---------- */
function isAdmin(){return !!(S.me&&S.me.role==='admin')}
function storeById(id){return S.stores.filter(function(s){return s.id===id})[0]}
function storeName(id){var s=storeById(id);return s?s.name:'(삭제된 매장)'}
function storeColor(id){var s=storeById(id);return s?s.color:'#999'}
function storeLabel(){return S.store==='all'?'전체 매장':storeName(S.store)}
function dot(c){return '<span class="dot" style="background:'+esc(c)+'" aria-hidden="true"></span>'}
function canEdit(e){return isAdmin()||e.uid===S.uid}
function targetStore(){return S.store&&S.store!=='all'?S.store:(S.lastStore&&storeById(S.lastStore)?S.lastStore:(S.stores[0]&&S.stores[0].id))}
function setStore(id){S.store=id;if(id!=='all')S.lastStore=id;try{localStorage.setItem(SKEY,id)}catch(e){}}

/* ---------- data helpers ---------- */
function live(){return S.entries.filter(function(e){return !e.deleted})}
function scoped(){return live().filter(function(e){return S.store==='all'||e.store===S.store})}
function isDup(e){return live().some(function(o){return o.id!==e.id&&o.store===e.store&&o.date===e.date&&o.amount===e.amount})}
function ext(e){var f=files.get(e.id);return f?f.ext:'jpg'}
function cleanItem(s){return String(s||'영수증').replace(/[\\\/:*?"<>|\s]+/g,'').slice(0,20)||'영수증'}
function fname(e){return e.date.replace(/-/g,'')+'_'+cleanItem(e.item)+'_'+(e.amount||0)+'.'+ext(e)}
function monthEntries(m){return scoped().filter(function(e){return e.date.slice(0,7)===m})}
function monthInfo(m){var p=m.split('-').map(Number);var last=new Date(p[0],p[1],0).getDate();var t=todayStr();var end=last;if(t.slice(0,7)===m)end=Number(t.slice(8));else if(t<m+'-01')end=0;return{y:p[0],mo:p[1],end:end,last:last}}
function byDay(m){var info=monthInfo(m);var map={};monthEntries(m).forEach(function(e){(map[e.date]=map[e.date]||[]).push(e)});
  var days=[];for(var d=1;d<=Math.max(info.end,0);d++){var ds=m+'-'+pad(d);days.push({date:ds,d:d,list:map[ds]||[]})}
  Object.keys(map).forEach(function(k){if(Number(k.slice(8))>info.end)days.push({date:k,d:Number(k.slice(8)),list:map[k]})});
  days.sort(function(a,b){return a.d-b.d});return days}
function dayTotal(list){return list.reduce(function(s,e){return s+(e.amount||0)},0)}
function monthTotal(m){return dayTotal(monthEntries(m))}
function rowsFor(m){var all=S.store==='all';var rows=[];byDay(m).forEach(function(day){
  if(!day.list.length){rows.push([day.date,0,'']);return}
  day.list.forEach(function(e){rows.push([e.date,e.amount,(all?'['+storeName(e.store)+'] ':'')+e.item])});
  if(day.list.length>1)rows.push([day.date,dayTotal(day.list),'일 합계'])});return rows}
function ml(m){var p=m.split('-');return p[0]+'년 '+Number(p[1])+'월'}
function md(ds){return Number(ds.slice(5,7))+'월 '+Number(ds.slice(8))+'일'}
function byId(id){return S.entries.filter(function(e){return e.id===id})[0]}

/* ---------- server storage (Supabase) ---------- */
function fromRow(r){return{id:r.id,date:String(r.date),item:r.item||'',amount:r.amount||0,check:!!r.is_check,at:Number(r.at)||0,saved:!!r.saved,uploaded:!!r.uploaded,
  store:r.store_id,uid:r.user_id,by:r.created_by_name||'',deleted:!!r.deleted_at,deletedAt:r.deleted_at||null,synced:true}}
function toRow(e){return{id:e.id,date:e.date,item:e.item||'',amount:e.amount||0,is_check:!!e.check,at:e.at||0,saved:!!e.saved,uploaded:!!e.uploaded,
  store_id:e.store,deleted_at:e.deleted?(e.deletedAt||new Date().toISOString()):null}}
function saveDb(e){if(!S.started||!e.store)return;
  sb.from('receipts').upsert(toRow(e)).then(function(r){if(r.error){toast('서버 저장에 실패했어요. 인터넷을 확인해 주세요')}else{e.synced=true;persist()}})}
function queueSave(e){persist();clearTimeout(qTimers[e.id]);qTimers[e.id]=setTimeout(function(){saveDb(e)},600)}
async function loadReceipts(){
  try{
    var r=await sb.from('receipts').select('*');
    if(r.error)throw r.error;
    var remote=(r.data||[]).map(fromRow);
    var ids={};remote.forEach(function(e){ids[e.id]=1});
    /* entries made on this phone that never reached the server are kept and pushed up */
    var localOnly=S.entries.filter(function(e){return !ids[e.id]&&!e.synced&&!e.deleted});
    localOnly.forEach(function(e){if(!e.store||!storeById(e.store))e.store=targetStore();e.uid=S.uid;saveDb(e)});
    S.entries=remote.concat(localOnly).sort(function(a,b){return (a.at||0)-(b.at||0)});
    persist();
  }catch(err){toast('서버에서 불러오지 못해 이 기기 기록을 보여요')}
}
async function loadStores(){var r=await sb.from('stores').select('*').order('created_at');S.stores=r.data||[]}
async function loadMembers(){
  if(!isAdmin())return;
  var a=await sb.from('members').select('*').order('created_at');
  var b=await sb.from('member_stores').select('*');
  S.members=a.data||[];S.mstores=b.data||[]}
async function boot(session){
  S.uid=session.user.id;S.myEmail=String(session.user.email||'').toLowerCase();
  S.view='loading';render();
  var r=await sb.from('members').select('*').eq('email',S.myEmail).maybeSingle();
  if(r.error||!r.data){S.view='noaccess';render();return}
  S.me=r.data;
  await loadStores();
  await loadMembers();
  var saved=null;try{saved=localStorage.getItem(SKEY)}catch(e){}
  if(saved==='all'&&S.stores.length>1)setStore('all');
  else if(saved&&storeById(saved))setStore(saved);
  else if(S.stores[0])setStore(S.stores[0].id);
  else S.store=null;
  await loadReceipts();
  initNav();S.view='home';render();
}

function slip(m,label){
  var n=monthEntries(m).length;
  return '<div class="slip"><div class="lbl">'+label+'</div><div class="big num">'+won(monthTotal(m))+'</div>'+barsHtml(m)+
    '<div class="meta"><span>'+ml(m)+'</span><span class="num">영수증 '+n+'건</span></div></div>'}
function barsHtml(m){
  var info=monthInfo(m);var sums={};monthEntries(m).forEach(function(e){var d=Number(e.date.slice(8));sums[d]=(sums[d]||0)+(e.amount||0)});
  var max=0;for(var k in sums)if(sums[k]>max)max=sums[k];
  var today=todayStr().slice(0,7)===m?Number(todayStr().slice(8)):0;var out='';
  for(var d=1;d<=info.last;d++){var v=sums[d]||0;var h=max?Math.max(v?8:4,Math.round(v/max*100)):4;
    out+='<span class="'+(v?'on':'')+(d===today?' today':'')+'" style="height:'+h+'%" title="'+d+'일 '+won(v)+'"></span>'}
  return '<div class="bars" role="img" aria-label="'+ml(m)+' 일별 지출">'+out+'</div>'}

  S.dlg=null;S.view=st.v;if(st.cur)S.cur=st.cur;if(st.month)S.month=st.month;S.copyText='';S.err='';render()});
function exitApp(){
  S.dlg=null;S.exiting=true;render();
  try{window.close()}catch(e){}
  setTimeout(function(){if(document.visibilityState==='visible')toast('뒤로가기를 한 번 더 누르면 종료돼요')},300)}

/* ---------- delete with undo ---------- */
function softDelete(ids,msg){
  var now=new Date().toISOString();
  ids.forEach(function(id){var e=byId(id);if(!e)return;clearTimeout(qTimers[id]);e.deleted=true;e.deletedAt=now});
  persist();
  sb.from('receipts').update({deleted_at:now}).in('id',ids).then(function(r){if(r.error)toast('서버에서 지우지 못했어요')});
  clearTimeout(softDelete._t);S.undo={ids:ids,msg:msg};
  softDelete._t=setTimeout(function(){S.undo=null;render()},7000);
}
function undoDelete(){
  var u=S.undo;if(!u)return;clearTimeout(softDelete._t);S.undo=null;
  u.ids.forEach(function(id){var e=byId(id);if(e){e.deleted=false;e.deletedAt=null}});persist();
  sb.from('receipts').update({deleted_at:null}).in('id',u.ids).then(function(r){if(r.error)toast('되돌리지 못했어요. 인터넷을 확인해 주세요');else toast('되돌렸어요')});
  render();
}

/* ---------- stores & members (admin) ---------- */
async function saveStore(){
  var d=S.dlg;var name=(($('#d-sname')||{}).value||'').trim();
  if(!name){d.msg='매장 이름을 입력해 주세요';render();return}
  if(S.stores.some(function(s){return s.name===name&&s.id!==d.id})){d.msg='같은 이름의 매장이 있어요';render();return}
  if(d.id){
    var r=await sb.from('stores').update({name:name}).eq('id',d.id);
    if(r.error){d.msg='저장하지 못했어요';render();return}
    storeById(d.id).name=name;S.dlg={type:'stores'};render();toast('매장 이름을 바꿨어요');
  }else{
    var used=S.stores.map(function(s){return s.color});
    var color=PALETTE.filter(function(c){return used.indexOf(c)<0})[0]||PALETTE[S.stores.length%PALETTE.length];
    var r2=await sb.from('stores').insert({name:name,color:color}).select().single();
    if(r2.error){d.msg='추가하지 못했어요';render();return}
    S.stores.push(r2.data);setStore(r2.data.id);S.dlg=null;render();toast(name+' 매장을 추가했어요');
  }
}
async function deleteStore(id){
  if(live().some(function(e){return e.store===id})){toast('영수증이 남아 있는 매장은 삭제할 수 없어요');S.dlg={type:'stores'};render();return}
  await sb.from('receipts').delete().eq('store_id',id);
  var r=await sb.from('stores').delete().eq('id',id);
  if(r.error){toast('삭제하지 못했어요');S.dlg={type:'stores'};render();return}
  S.stores=S.stores.filter(function(s){return s.id!==id});
  S.entries=S.entries.filter(function(e){return e.store!==id});persist();
  if(S.store===id)setStore(S.stores[0]?S.stores[0].id:null);
  if(S.store==='all'&&S.stores.length<2&&S.stores[0])setStore(S.stores[0].id);
  S.dlg={type:'stores'};render();toast('매장을 삭제했어요');
}
async function addMember(){
  var name=(($('#m-name')||{}).value||'').trim();
  var email=(($('#m-email')||{}).value||'').trim().toLowerCase();
  var sids=$$('.m-st:checked').map(function(x){return x.value});
  if(!name){toast('직원 이름을 입력해 주세요');return}
  if(!/^\S+@\S+\.\S+$/.test(email)){toast('이메일을 정확히 입력해 주세요');return}
  if(!sids.length){toast('볼 수 있는 매장을 하나 이상 체크해 주세요');return}
  S.busyMsg='1';render();
  var r=await sb.from('members').insert({name:name,email:email,role:'staff'}).select().single();
  if(r.error){S.busyMsg='';render();toast(/duplicate|unique/i.test(r.error.message)?'이미 등록된 이메일이에요':'추가하지 못했어요');return}
  var r2=await sb.from('member_stores').insert(sids.map(function(s){return{member_id:r.data.id,store_id:s}}));
  if(r2.error)toast('매장 배정 중 문제가 생겼어요. 아래에서 다시 체크해 주세요');
  await loadMembers();S.busyMsg='';render();toast(name+' 님을 추가했어요');
}
async function toggleMemberStore(mid,sid,on){
  var r=on?await sb.from('member_stores').insert({member_id:mid,store_id:sid}):await sb.from('member_stores').delete().eq('member_id',mid).eq('store_id',sid);
  if(r.error){toast('바꾸지 못했어요')}
  await loadMembers();render();
}
async function renameMember(){
  var d=S.dlg;var name=(($('#d-mname')||{}).value||'').trim();if(!name){toast('이름을 입력해 주세요');return}
  var r=await sb.from('members').update({name:name}).eq('id',d.id);
  if(r.error){toast('바꾸지 못했어요');return}
  var m=S.members.filter(function(x){return x.id===d.id})[0];if(m)m.name=name;
  if(S.me&&S.me.id===d.id)S.me.name=name;
  S.dlg=null;render();toast('이름을 바꿨어요');
}
async function deleteMember(id){
  var r=await sb.from('members').delete().eq('id',id);
  if(r.error){toast('삭제하지 못했어요');return}
  await loadMembers();S.dlg=null;render();toast('직원을 삭제했어요');
}

/* ---------- AI reading (server route /api/read) ---------- */
function shrink(file){return new Promise(function(res){
  var url=URL.createObjectURL(file);var img=new Image();
  img.onload=function(){try{var max=1600,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
    var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(function(b){URL.revokeObjectURL(url);res(b||file)},'image/jpeg',0.85)}catch(e){URL.revokeObjectURL(url);res(file)}};
  img.onerror=function(){URL.revokeObjectURL(url);res(file)};img.src=url})}
function toB64(blob){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(',')[1])};fr.onerror=rej;fr.readAsDataURL(blob)})}
async function analyze(small){
  var s=await sb.auth.getSession();var tok=s.data&&s.data.session&&s.data.session.access_token;
  if(!tok)throw{code:'not_granted'};
  var image=await toB64(small);
  var r;try{r=await fetch('/api/read',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify({image:image})})}
  catch(e){throw{code:'unavailable'}}
  if(r.status===401)throw{code:'not_granted'};
  if(r.status===429)throw{code:'rate_limited'};
  if(!r.ok){var ej={};try{ej=await r.json()}catch(x){}
    throw{code:'server',status:r.status,err:ej.error||'',up:ej.status||0,detail:ej.message||''}}
  var o=await r.json();
  if(o.error==='not_receipt')throw{code:'not_receipt'};
  if(o.error)throw{code:'server',status:r.status,err:o.error,detail:o.message||''};
  return o}
function errMsg(e){var c=e&&e.code;
  if(c==='not_granted')return '로그인이 만료됐어요. 다시 로그인해 주세요.';
  if(c==='rate_limited')return '요청이 몰렸어요. 잠시 후 다시 시도해 주세요.';
  if(c==='unavailable')return '읽기 서버에 연결하지 못했어요. 인터넷을 확인해 주세요.';
  if(c==='server'){
    if(e.err==='server_not_configured')return '[설정] Vercel에 ANTHROPIC_API_KEY가 없어요. 키를 넣고 Redeploy 해 주세요.';
    if(e.err==='upstream'){var d=String(e.detail||'');
      if(/credit|balance|billing/i.test(d))return '[크레딧] Claude API 크레딧이 부족해요. 충전해 주세요. ('+d+')';
      if(e.up===401)return '[키 오류] API 키가 잘못됐어요. 키를 다시 복사해 넣어 주세요.';
      return '[API '+e.up+'] '+d}
    if(e.err==='bad_image')return '[사진] 사진이 너무 크거나 형식이 맞지 않아요. 카메라 설정을 JPG로 바꾸거나 스크린샷으로 올려 보세요. ('+e.detail+')';
    if(e.err==='parse')return '[읽기 결과] 내용을 정리하지 못했어요: '+String(e.detail||'(빈 응답)').slice(0,120);
    if(e.err==='crash')return '[서버 오류] '+e.detail;
    return '[서버 '+e.status+'] '+(e.err||'알 수 없는 오류')}
  if(c==='not_receipt')return '영수증으로 보이지 않아요. 영수증이 화면에 꽉 차게 다시 찍어 주세요.';
  return '읽지 못했어요. ['+(c||'unknown')+(e&&e.message?' '+e.message:'')+']'}

async function readOne(file,store){
    var small=await shrink(file);var o=await analyze(small);
    var amt=Math.round(Number(String(o.amount).replace(/[^\d.-]/g,'')))||0;
    var okDate=/^\d{4}-\d{2}-\d{2}$/.test(o.date||'');
    var e={id:newId(),date:okDate?o.date:todayStr(),item:String(o.item||o.store||'영수증').slice(0,20),amount:amt,check:!okDate,at:Date.now(),
      store:store,uid:S.uid,by:(S.me&&S.me.role==='staff')?S.me.name:''};
    var t=(file.type||'').toLowerCase();var ex=t==='image/png'?'png':t==='image/webp'?'webp':'jpg';
    var keep=(t==='image/jpeg'||t==='image/png'||t==='image/webp')?file:small;
    files.set(e.id,{blob:keep,ext:ex});
    S.entries.push(e);persist();saveDb(e);return e;
}
async function handleFiles(list){
  var arr=list||[];if(!arr.length)return;
  var store=targetStore();if(!store){toast('매장을 먼저 추가해 주세요');return}
  S.err='';S.batch=[];var n=arr.length;
  for(var i=0;i<n;i++){
    S.view='busy';S.prog={i:i+1,n:n};render();
    try{var e=await readOne(arr[i],store);S.batch.push({ok:true,id:e.id})}
    catch(err){S.batch.push({ok:false,name:arr[i].name||'사진',msg:errMsg(err)})}
  }
  S.prog=null;
  if(n===1&&S.batch[0].ok){S.cur=S.batch[0].id;go('result')}
  else if(S.batch.some(function(x){return x.ok})){go('batch')}
  else{S.err=n+'장 모두 읽지 못했어요. '+S.batch[0].msg;S.view=(history.state&&history.state.v!=='root'&&history.state.v)||'home';if(S.view!=='home')toast(S.err);render();window.scrollTo(0,0)}}

/* ---------- save / export (plain browser downloads) ---------- */
function downloadBlob(blob,name){
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}
function savePhoto(){
  var e=curE();var f=e&&files.get(e.id);if(!f){toast('사진은 올린 직후에만 저장할 수 있어요');return}
  downloadBlob(f.blob,fname(e));e.saved=true;persist();if(canEdit(e))saveDb(e);render();toast('저장했어요')}
function tsv(){return rowsFor(S.month).map(function(r){return r.join('\t')}).join('\n')}
async function copyIt(){var t=tsv();if(!t){toast('복사할 내용이 없어요');return}
  try{await navigator.clipboard.writeText(t);toast('복사했어요 · 정산표에 붙여넣으세요')}
  catch(e){S.copyText=t;render()}}
function csvIt(){var rows=rowsFor(S.month);if(!rows.length){toast('저장할 내용이 없어요');return}
  var q=function(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var txt='﻿날짜,금액,품목\r\n'+rows.map(function(r){return r.map(q).join(',')}).join('\r\n');
  downloadBlob(new Blob([txt],{type:'text/csv;charset=utf-8'}),'영수증_'+cleanItem(storeLabel())+'_'+S.month+'.csv');toast('저장했어요')}

/* ---------- auth ---------- */
async function sendLogin(){
  var em=($('#em')||{}).value||'';S.email=em.trim();
  if(!/^\S+@\S+\.\S+$/.test(S.email)){S.loginMsg='이메일을 정확히 입력해 주세요';render();return}
  S.sending=true;S.loginMsg='';render();
  var r=await sb.auth.signInWithOtp({email:S.email,options:{emailRedirectTo:location.origin+location.pathname}});
  S.sending=false;
  if(r.error){S.loginMsg='메일을 보내지 못했어요: '+r.error.message}else{S.sent=true}
  render();
}
async function logout(){await sb.auth.signOut()}
sb.auth.onAuthStateChange(function(ev,session){
  if(session){
    if(S.started)return;
    S.started=true;
    setTimeout(function(){boot(session)},0);
  }else{
    S.started=false;S.entries=[];S.me=null;S.stores=[];S.members=[];S.mstores=[];S.dlg=null;S.undo=null;S.view='login';S.sent=false;
    try{localStorage.removeItem(KEY)}catch(e){}
    render();
  }
});

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act');var id=b.getAttribute('data-id');
  if(a==='noop')return;
  if(a==='dlgclose'){if(b.classList.contains('modal')&&ev.target!==b)return;closeDlg();return}
  if(a==='cam')$('#f-cam').click();
  else if(a==='alb')$('#f-alb').click();
  else if(a==='login')sendLogin();
  else if(a==='logout')logout();
  else if(a==='home'){S.err='';goBack()}
  else if(a==='exit-no'){S.dlg=null;history.pushState({v:'home'},'');render()}
  else if(a==='exit-yes')exitApp();
  else if(a==='month'){S.copyText='';S.month=S.view==='home'?todayStr().slice(0,7):S.month;go('month')}
  else if(a==='staff'){loadMembers().then(render);go('staff')}
  else if(a==='open'){S.cur=id;go('result')}
  else if(a==='del'){var e=curE();if(!e)return;files.delete(e.id);softDelete([e.id],'영수증 1건을 삭제했어요');goBack()}
  else if(a==='delmonth'){var list=monthEntries(S.month);openDlg({type:'monthDel',n:list.length,total:dayTotal(list)})}
  else if(a==='delmonth-yes'){var ids=monthEntries(S.month).map(function(e){return e.id});S.dlg=null;softDelete(ids,ids.length+'건을 삭제했어요');render()}
  else if(a==='undo')undoDelete();
  else if(a==='stores')openDlg({type:'stores'});
  else if(a==='pickstore'){setStore(id);S.dlg=null;render();toast(storeLabel()+' 선택')}
  else if(a==='newstore')openDlg({type:'storeEdit',id:null});
  else if(a==='editstore')openDlg({type:'storeEdit',id:id});
  else if(a==='savestore')saveStore();
  else if(a==='delstore')openDlg({type:'storeDel',id:S.dlg.id});
  else if(a==='delstore-yes')deleteStore(S.dlg.id);
  else if(a==='addmember')addMember();
  else if(a==='togms')toggleMemberStore(b.getAttribute('data-m'),b.value,b.checked);
  else if(a==='memrename')openDlg({type:'memRename',id:id});
  else if(a==='memrename-yes')renameMember();
  else if(a==='memdel')openDlg({type:'memDel',id:id});
  else if(a==='memdel-yes')deleteMember(S.dlg.id);
  else if(a==='savephoto')savePhoto();
  else if(a==='copy')copyIt();
  else if(a==='csv')csvIt();
  else if(a==='closecopy'){S.copyText='';render()}
  else if(a==='prev'||a==='next'){var p=S.month.split('-').map(Number);var d=new Date(p[0],p[1]-1+(a==='next'?1:-1),1);S.month=d.getFullYear()+'-'+pad(d.getMonth()+1);S.copyText='';history.replaceState(snap(),'');render()}
});
document.addEventListener('input',function(ev){
  var t=ev.target;var e=curE();if(!e||!canEdit(e))return;
  if(t.id==='f-date'&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){e.date=t.value;e.check=false}
  else if(t.id==='f-item')e.item=t.value.slice(0,20);
  else if(t.id==='f-amt')e.amount=Math.max(0,Math.round(Number(t.value))||0);
  else if(t.id==='f-store'){e.store=t.value}
  else return;
  queueSave(e);var fn=$('#fname');if(fn)fn.textContent=fname(e);var db=$('#dupbox');if(db)db.innerHTML=dupHtml(e)});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Enter')return;
  if(ev.target.id==='em')sendLogin();
  else if(ev.target.id==='d-sname')saveStore();
  else if(ev.target.id==='d-mname')renameMember();
});
['#f-cam','#f-alb'].forEach(function(id){$(id).addEventListener('change',function(ev){var list=Array.prototype.slice.call(ev.target.files||[]);ev.target.value='';handleFiles(list)})});

if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){})}
S.view='loading';render();
setTimeout(function(){if(!S.started&&S.view==='loading'){S.view='login';render()}},4000);
})();
</script>
